<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>site musical</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU -->
    <header>
        <h1>Streaming Musical</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Músicas</a>
            <a href="#">Vídeos</a>
        </nav>
    </header>

    <!-- BANNER -->
    <section class="banner">
        <h2>Suas músicas e vídeos favoritos</h2>
        <p>Ouça e assista tudo em um só lugar 🎬🎧</p>
    </section>

    <!-- CONTAINER -->
    <div class="container">

        <h2 class="titulo"> Destaques</h2>

        <div class="grid">

            <!-- CARD 1 -->
            <div class="card">

                <img src="imagens/arrependidaço.jpg" alt="Capa música">

                <h3>Arrependidaço</h3>

                <p>Ferrugem</p>

                <!-- ÁUDIO -->
                <audio controls autoplay loop>
                    <source src="audio/Ferrugem - Arrependidaço (Onde Você Anda) (Sentimento) - Ferrugem (youtube).mp3" type="audio/mp3">
                </audio>

                <!-- VÍDEO -->
                <video controls poster="imagens/img1.jpg">
                    <source src="videos/Ferrugem - Arrependidaço (Onde Você Anda) (Sentimento) - Ferrugem (720p, h264, youtube).mp4" type="video/mp4">
                </video>

            </div>

            <!-- CARD 2 -->
            <div class="card">

                <img src="imagens/a morte.jpg" alt="Capa música">

                <h3>A morte do autotune</h3>

                <p>A morte do autotune</p>

                <audio controls>
                    <source src="audio/Matuê - A Morte do Autotune 💔 - 30PRAUM (youtube).mp3" type="audio/mp3">
                </audio>

                <video controls poster="imagens/img2.jpg">
                    <source src="videos/Matuê - A Morte do Autotune 💔 - 30PRAUM (720p, h264, youtube).mp4" type="video/mp4">
                </video>

            </div>

            <!-- CARD 3 -->
            <div class="card">

                <img src="imagens/maquina do tempo.jpg" alt="Capa música">

                <h3>Maquina do tempo</h3>

                <p>Maquina do tempo.</p>

                <audio controls>
                    <source src="audio/Matuê - Máquina do Tempo - 30PRAUM (youtube).mp3" type="audio/mp3">
                </audio>

                <video controls poster="imagens/img3.jpg">
                    <source src="videos/Matuê - Máquina do Tempo - 30PRAUM (720p, h264, youtube).mp4" type="video/mp4">
                </video>

            </div>

        </div>

    </div>

    <!-- RODAPÉ -->
    <footer>
        <p>Desenvolvido por Eduardo Alamino</p>
    </footer>

</body>
</html>
